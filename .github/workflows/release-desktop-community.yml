# Build the community Windows installer for this fork and, only when asked, publish it as a GitHub
# Release.
#
# This workflow is the fork's own distribution lane. It never invokes the upstream publication path:
# no upload, COS, or auto-update setting is configured, the packaging command is the repository's
# existing unsigned Windows command, and the variant it builds is not publishable through
# `createDesktopUploadPlan` or the installed-update qualification even if someone tried.
#
# The installer is unsigned. Signing status and product variant are independent inputs, so an
# unsigned build keeps its variant's identity; the `community` variant is what separates this binary
# from a DeepSeek release, and this workflow never selects any other variant.
#
# Manual only, with no tag trigger: no push, tag, or schedule can start a run. The `publish` input is
# false by default, so a first iteration exercises the build lane and nothing else.
#
# Three names meet here and are deliberately kept apart. The build produces the installer under the
# version it packages, which is upstream's (`apps/desktop/package.json`) plus the build stamp the
# packaging adds. The release is tagged and titled from the fork's own community version
# (`apps/desktop/community-version.json`, the single source of truth the About surface and the
# diagnostics report share), and the tag has to name exactly that version, so a fork release never
# re-versions upstream's packages and never claims upstream's series. What is *published* carries a
# third name, `DeepSeek-Harness-Community-v<community version>-Windows-x64.exe`, because the manifest
# a running installation reads has to name the file the release actually serves. The commit those
# notes quote is fetched from the upstream repository and resolved there — the file records the tag,
# not a hash that would drift with it, and a fork's own clone does not carry upstream's tags — and the
# packaging step derives the same commit into the installer's own manifest.
#
# A release therefore publishes three files, in one order, in the job that has a checkout and a
# toolchain: the installer under its published name, the update manifest generated from those renamed
# bytes, and a checksum list for anyone verifying a download by hand. The publish job holds neither
# the repository nor a toolchain, so it can only re-verify what it was handed and upload it.
name: Release (desktop community)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Community release tag to publish under, such as community-v0.2. Must name the version in apps/desktop/community-version.json.'
        required: true
        type: string
      publish:
        description: 'Create a GitHub Release from the staged assets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A release build is not worth cancelling halfway through, and a cancelled run must never be
  # mistaken for a completed one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  # CI isolation for the build process. This describes this job, not the packaged application: no
  # workflow variable reaches the application a user installs, which seeds its own telemetry mode
  # from its declared variant.
  DSH_TELEMETRY_DISABLED: '1'
  # The fork's own release destination and the manifest it publishes there, named once. The packaged
  # application reads both from `apps/desktop/community-release.json`, and
  # `apps/desktop/tests/community-release-workflow.spec.ts` compares the two copies, so a release can
  # neither be published where the client does not look nor point a client at a release this lane did
  # not publish.
  COMMUNITY_RELEASE_REPOSITORY: newplayer0408-jpg/deepseek-harness
  COMMUNITY_RELEASE_MANIFEST: latest-community.json

jobs:
  build:
    name: Build community installer (win-x64)
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      # The fork's own product version and the upstream base it was synced to, read here because this
      # is the job with a checkout. The publish lane holds none, so it can neither discover a different
      # value nor read the repository at all.
      community_version: ${{ steps.community-version.outputs.version }}
      upstream_base: ${{ steps.community-version.outputs.upstream_base }}
      upstream_commit: ${{ steps.upstream-commit.outputs.upstream_commit }}
      # The tag this run checked, so the publish lane publishes what the build lane validated and
      # cannot pick up a different value for itself.
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
      # The version the installer packages, which is upstream's and not part of any published name:
      # the release notes name it as a fact rather than deriving it from a file name.
      packaged_version: ${{ steps.installer.outputs.packaged_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true
          # The tag the release records is fetched from upstream below, because a fork's clone holds
          # this fork's tags and none of upstream's. The packaging step later derives the same commit
          # from the checkout it packages, which is what keeps the installer's own manifest and the
          # release notes naming one value.
          fetch-tags: true

      # The release facts are read and checked before anything is fetched or built, so a malformed
      # metadata file stops the run instead of producing an installer that cannot be published under a
      # name the repository agrees with. The checks mirror the shell's own reader, which is what keeps
      # one value usable by the application, by this workflow, and by the release notes.
      #
      # The base tag is reported by the release helper rather than taken from the file's own text, so
      # what this job hands on is a value that has already been accepted as an upstream release tag.
      # That rule is spelled once, in the helper, because the fetch below is gated by the same one.
      #
      # The commit is not read here, because the file deliberately does not hold one: a hash committed
      # beside the tag is a repository reference that drifts the moment the tag moves.
      - name: Read Community release metadata
        id: community-version
        shell: pwsh
        run: |
          $json = Get-Content apps/desktop/community-version.json -Raw | ConvertFrom-Json
          $version = [string]$json.communityVersion
          if ($version -notmatch '^\d{1,4}(\.\d{1,5}){0,2}(-[A-Za-z0-9.]{1,32})?$') {
            throw "community-version.json declares an unusable communityVersion: '$version'"
          }
          $base = (node apps/desktop/scripts/community-upstream-base.mjs validate | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $base -eq '') {
            throw 'community-version.json declares an unusable upstreamBase'
          }
          Write-Output "community version v$version, based on $base"
          "version=$version" >> $env:GITHUB_OUTPUT
          "upstream_base=$base" >> $env:GITHUB_OUTPUT

      # The base tag is not assumed to be in this checkout. Tags are not inherited by a fork, so a
      # runner's clone of this repository holds this fork's tags and none of upstream's, and reading
      # the tag out of the checkout passes on every machine that added upstream as a remote and fails
      # on the first one that did not. The helper fetches that one tag, and only that one, from the
      # upstream repository — the destination is a constant in the helper, so neither this workflow's
      # inputs nor the version file can decide where the lane reads a base from, and `--no-tags` keeps
      # the fetch from pulling upstream's whole tag namespace into the checkout.
      - name: Fetch the pinned upstream base
        shell: pwsh
        run: |
          node apps/desktop/scripts/community-upstream-base.mjs fetch
          if ($LASTEXITCODE -ne 0) {
            throw 'the declared upstream base could not be fetched from the upstream repository'
          }

      # Resolved from the tag the fetch just placed here, and recorded as a fact rather than a guess.
      # Unlike the application, which omits a commit it cannot resolve, this lane fails: a published
      # release has to name the commit its installer was built on.
      - name: Resolve the upstream commit
        id: upstream-commit
        shell: pwsh
        run: |
          $commit = (node apps/desktop/scripts/community-upstream-base.mjs resolve | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') {
            throw 'community-version.json names an upstreamBase this checkout cannot resolve to a commit'
          }
          Write-Output "upstream base commit $commit"
          "upstream_commit=$commit" >> $env:GITHUB_OUTPUT

      # The tag is the one published name that arrives as operator input instead of as a committed
      # fact, so it is checked against the version the file declares before anything is built. A
      # mismatch would publish a manifest whose asset URL points into a release that does not describe
      # it, and a two-hour build is worth spending only once that is settled. The same rule is
      # enforced again where the manifest is written, because that step is what a client's fetch
      # depends on.
      - name: Validate the release tag
        id: release-tag
        shell: pwsh
        env:
          # Passed through the environment rather than interpolated into the script below, so an input
          # can never be read as PowerShell.
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMUNITY_VERSION: ${{ steps.community-version.outputs.version }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^community-v\d{1,4}(\.\d{1,5}){0,2}$') {
            throw "release_tag must be a Community release tag such as community-v0.2, with no prerelease suffix: '$($env:RELEASE_TAG)'"
          }
          $expected = "community-v$($env:COMMUNITY_VERSION)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "release_tag $($env:RELEASE_TAG) does not name the version community-version.json declares ($expected); freeze the version or dispatch the matching tag"
          }
          Write-Output "publishing as $($env:RELEASE_TAG)"
          "release_tag=$($env:RELEASE_TAG)" >> $env:GITHUB_OUTPUT

      # The bundled runtime's native modules are built here, and pnpm's store is linked rather than
      # copied, which needs symlink support on the hosted runner.
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Configure pnpm store path
        id: pnpm-store
        # Native pwsh, like every Windows step here: `.github/AGENTS.md` keeps Windows jobs off the
        # bash shim, whose path translation would otherwise rewrite the store path written below.
        shell: pwsh
        run: |
          $storeRoot = Join-Path $HOME '.local/share/pnpm/store'
          "PNPM_CONFIG_STORE_DIR=$storeRoot" >> $env:GITHUB_ENV
          $env:PNPM_CONFIG_STORE_DIR = $storeRoot
          $storePath = (pnpm store path --silent).Trim()
          if ($LASTEXITCODE -ne 0) { throw "pnpm store path failed with exit code $LASTEXITCODE" }
          "path=$storePath" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # Release settings are file-owned: the packaging scripts read them from this file and strip them
      # from the ambient environment, so the variant cannot be supplied any other way. The community
      # variant pins its own application identifier and takes no policy origin, so the variant line is
      # the file's whole content — nothing here can carry a DeepSeek identity, an update origin, or a
      # credential into the build.
      - name: Write the community packaging environment
        shell: pwsh
        run: |
          Set-Content -Path apps/desktop/.env.windows -Encoding utf8 -Value 'DSH_DESKTOP_VARIANT=community'
          Get-Content apps/desktop/.env.windows

      # The canonical unsigned Windows command. It prepares the runtime, builds and packages the
      # application, and runs the packaged-runtime smoke itself, so no second packaging implementation
      # and no separate smoke step exists here.
      - name: Package the community Windows x64 installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Verify the community installer
        id: installer
        shell: pwsh
        run: |
          # The artifact name carries the version the installer packages — upstream's, or the build
          # stamp derived from it — while the release tag carries the community version read above.
          # This step pins the artifact name alone.
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $root = '.dsh-build/win-x64-community'
          $expected = "deepseek-harness-$version-win-x64-community-unsigned.exe"
          $installer = Get-Item -LiteralPath (Join-Path $root $expected) -ErrorAction SilentlyContinue
          if ($null -eq $installer) {
            throw "missing expected community installer $expected in $root"
          }
          $names = @(Get-ChildItem -LiteralPath $root -File | ForEach-Object { $_.Name })
          Write-Output "artifacts: $($names -join ', ')"
          foreach ($name in $names) {
            if ($name -match '-dev') {
              throw "a development artifact was produced: $name"
            }
            if ($name -match '^deepseek-harness-.*-win-x64(-unsigned)?\.exe$') {
              throw "a release-named artifact was produced: $name"
            }
          }
          # A packaged Windows installer measures roughly 314 MB (0.1.7-rc.1, unsigned), because it
          # carries the bundled runtime and the LibreOfficeKit engine. The floor only catches a stub
          # or a truncated artifact; it is deliberately far below today's size so a trimmed future
          # runtime does not fail here.
          if ($installer.Length -lt 100MB) {
            throw "installer is too small to be complete: $($installer.Length) bytes"
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          $size = [math]::Round($installer.Length / 1MB, 1)
          Write-Output "installer: $($installer.Name) ($size MiB)"
          Write-Output "sha256: $hash"
          "Community installer ``$($installer.Name)`` ($size MiB), SHA-256 ``$hash``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "packaged_version=$version" >> $env:GITHUB_OUTPUT

      # The three published files, in the order that makes them describe one object. The installer is
      # renamed to the name it is published under first, because that name is what the manifest's URL
      # is built from; the digest is taken from the renamed file, because it is a statement about the
      # bytes that will be downloaded; and the manifest and the checksum list are both written from
      # that digest. The script then re-reads the staged installer and refuses to finish when the
      # digest disagrees with the manifest, so a staging step that altered the file fails here instead
      # of publishing a checksum for something nobody receives.
      #
      # The script derives the published name from `apps/desktop/community-version.json` and refuses a
      # release version that has not been frozen, which is what keeps a development build from ever
      # producing a manifest that says `stable` about `0.2-dev`.
      - name: Stage the release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.release_tag }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          # The commit's own time, so rerunning the same release regenerates the same manifest bytes.
          $publishedAt = (git log -1 --format='%cI').Trim()
          if ($LASTEXITCODE -ne 0 -or $publishedAt -eq '') {
            throw 'cannot read the commit time this release publishes under'
          }
          Write-Output "publication time: $publishedAt"
          # An absolute staging path, because a filtered package script runs in the package directory
          # rather than in the workspace: a relative `--out` would stage under `apps/desktop`, where
          # the steps below — which run at the workspace root — would not find it.
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-stage'
          pnpm --filter @deepseek-ai/dsh-desktop run community:release:stage $env:INSTALLER --out $stage --tag $env:RELEASE_TAG --published-at $publishedAt

      # The staged directory is the release, so its file set is pinned here rather than left to a glob
      # at upload time: an extra file appearing in it would otherwise be published by the uploader
      # without anyone having named it.
      - name: Verify the staged release assets
        shell: pwsh
        run: |
          $names = @(Get-ChildItem -LiteralPath release-stage -File | ForEach-Object { $_.Name } | Sort-Object)
          Write-Output "staged: $($names -join ', ')"
          $installers = @($names | Where-Object { $_.EndsWith('.exe') })
          if ($installers.Count -ne 1) {
            throw "expected exactly one installer in release-stage, found $($installers.Count)"
          }
          $expected = @($installers[0], '${{ env.COMMUNITY_RELEASE_MANIFEST }}', 'SHA256SUMS.txt') | Sort-Object
          $unexpected = @(Compare-Object $names $expected)
          if ($unexpected.Count -ne 0) {
            throw "release-stage holds $($names -join ', '); a release publishes exactly $($expected -join ', ')"
          }

      # Only the staged release: the unpacked application, the blockmap, and the packaging journals
      # stay in the runner's build tree, where nothing can publish them.
      - name: Upload the staged release assets
        uses: actions/upload-artifact@v4
        with:
          name: community-release-assets
          path: release-stage/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the community release
    needs: build
    # Inert unless the operator asks for it, which is what keeps the first iterations build-only.
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job that may write. It holds no checkout and no secret: it publishes the files it was
    # handed, to the repository this lane is allowed to publish to and to no other.
    permissions:
      contents: write
    environment: release-desktop-community
    # Publishing is a transaction. A rerun has to finish a release the first attempt left
    # half-uploaded rather than fail on it, and two runs must never edit one release at the same time;
    # the tag keys the group, so different releases never queue behind one another.
    concurrency:
      group: release-desktop-community-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: community-release-assets
          path: dist

      # The publish lane has no checkout and no toolchain, so every statement it makes about the
      # release is about the bytes in front of it. Five things are pinned: which files are present,
      # that the installer still hashes to the released checksum list, that the manifest — the one
      # file a client reads — carries that same digest, that its asset URL is this release's immutable
      # tag path, and that it never addresses the installer through `latest`, whose meaning moves with
      # the next release.
      - name: Verify the staged release assets
        env:
          MANIFEST: ${{ env.COMMUNITY_RELEASE_MANIFEST }}
          REPOSITORY: ${{ env.COMMUNITY_RELEASE_REPOSITORY }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          ls -l dist
          staged=$(find dist -type f | wc -l)
          if [ "$staged" -ne 3 ]; then
            echo "a release publishes exactly three files, and dist holds $staged" >&2
            exit 1
          fi
          asset=$(basename "$(ls dist/*.exe)")
          for expected in "$asset" "$MANIFEST" SHA256SUMS.txt; do
            [ -f "dist/$expected" ] || { echo "missing dist/$expected" >&2; exit 1; }
          done
          # `sha256sum -c` reads the checksum list the release ships, so this is that file's own claim
          # being tested rather than a second copy of the digest.
          (cd dist && sha256sum -c SHA256SUMS.txt)
          declared=$(grep -o '"sha256": "[0-9a-f]\{64\}"' "dist/$MANIFEST" | cut -d'"' -f4)
          actual=$(sha256sum "dist/$asset" | cut -d' ' -f1)
          if [ -z "$declared" ] || [ "$declared" != "$actual" ]; then
            echo "the manifest does not carry the staged installer's digest" >&2
            exit 1
          fi
          grep -F "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/$asset" "dist/$MANIFEST" >/dev/null \
            || { echo "the manifest does not name this release's asset URL" >&2; exit 1; }
          if grep -F 'latest/download' "dist/$MANIFEST" >/dev/null; then
            echo "the manifest must not address the installer through the moving latest alias" >&2
            exit 1
          fi

      - name: Create or update the GitHub Release
        # This job has no checkout, so `gh` cannot discover the repository from a working tree and must
        # be given it explicitly — the fork's own repository, named in the workflow rather than taken
        # from whoever ran it.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ env.COMMUNITY_RELEASE_REPOSITORY }}
          REPOSITORY: ${{ github.repository }}
          MANIFEST: ${{ env.COMMUNITY_RELEASE_MANIFEST }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          COMMUNITY_VERSION: ${{ needs.build.outputs.community_version }}
          PACKAGED_VERSION: ${{ needs.build.outputs.packaged_version }}
          UPSTREAM_BASE: ${{ needs.build.outputs.upstream_base }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          # A run this lane cannot prove is publishing to the fork's own repository stops here, rather
          # than creating a release in a copy of the fork that this workflow was never reviewed for.
          if [ "$REPOSITORY" != "$GH_REPO" ]; then
            echo "this workflow publishes only to $GH_REPO, not to $REPOSITORY" >&2
            exit 1
          fi
          # A tag that already exists has to name the commit being released: a release page
          # attributing these bytes to another commit would be worse than a failed run. When the ref
          # answers, the tag is there and is compared; when it does not, the tag is absent and the
          # create below makes it at this commit. An API failure after this point fails the run too.
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null || true)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "${{ github.sha }}" ]; then
            echo "tag $RELEASE_TAG names $tag_commit, not the built ${{ github.sha }}" >&2
            exit 1
          fi
          asset=$(basename "$(ls dist/*.exe)")
          hash=$(sha256sum "dist/$asset" | cut -d' ' -f1)
          cat > notes.md <<'NOTES'
          Unofficial community build of DeepSeek Harness. This project and its binary releases are not published, endorsed, or supported by DeepSeek. Based on the open-source DeepSeek Harness project.

          DeepSeek Harness 的非官方社区构建。本项目及其二进制发行版并非由 DeepSeek 发布、认可或提供支持，基于开源 DeepSeek Harness 项目构建。

          Windows x64 only, and unsigned. Verify the download against the checksum below before running it; Windows will warn about an unknown publisher.

          This build uses its own application identity, install directory, shortcuts and `~/.dsh-community` home, so it installs beside a DeepSeek release without touching it. It contacts no DeepSeek update or telemetry service: mandatory updates are disabled and session-log telemetry defaults to disabled. `LICENSE` and `THIRD_PARTY_NOTICES.md` ship in the installation under `licenses/`.

          ### Known limitations

          - Upgrading from an earlier Community version needs one manual install: this release cannot install itself over the version it replaces.
          - A Community installation and an official DeepSeek release can be installed side by side, but the two cannot run at the same time.
          - The application checks for and downloads Community updates; installing one is a manual step, and no automatic or background installation is available.
          NOTES
          cat >> notes.md <<NOTES

          - Community version: \`v$COMMUNITY_VERSION\`
          - Upstream base: \`$UPSTREAM_BASE\` ($UPSTREAM_COMMIT)
          - Installer: \`$asset\` (packages $PACKAGED_VERSION)
          - Update manifest: \`$MANIFEST\`
          - SHA-256: \`$hash\`
          - Source: \`${{ github.sha }}\`
          NOTES
          cat notes.md
          title="DeepSeek Harness Community v$COMMUNITY_VERSION (unofficial, unsigned)"
          # Not a prerelease: `releases/latest` — the address the client reads the manifest from —
          # skips prereleases, so a prerelease would hide the very file this release exists to serve.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file notes.md
            gh release upload "$RELEASE_TAG" "dist/$asset" "dist/$MANIFEST" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$asset" "dist/$MANIFEST" dist/SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "$title" \
              --notes-file notes.md
          fi
